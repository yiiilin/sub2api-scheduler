<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.SiteName}} · sub2api 扩展</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --ok:#059669; --warn:#d97706; --err:#dc2626; --pri:#2563eb; --lane-bg:#f9fafb; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#111827; --card:#1f2937; --border:#374151; --text:#f9fafb; --muted:#9ca3af; --ok:#34d399; --warn:#fbbf24; --err:#f87171; --pri:#60a5fa; --lane-bg:#16202e; }
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding:16px; font-size:14px; }
h1 { font-size:18px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
h2 { font-size:15px; margin:16px 0 8px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
th { color:var(--muted); font-weight:500; }
.badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
.badge.ok { background:rgba(5,150,105,.12); color:var(--ok); }
.badge.err { background:rgba(220,38,38,.12); color:var(--err); }
.badge.warn { background:rgba(217,119,6,.12); color:var(--warn); }
.badge.muted { background:rgba(107,114,128,.12); color:var(--muted); }
.badge.pri { background:rgba(37,99,235,.12); color:var(--pri); }
.btn { display:inline-block; padding:5px 14px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:13px; }
.btn:hover { border-color:var(--pri); color:var(--pri); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn.primary { background:var(--pri); color:#fff; border-color:var(--pri); }
.btn.danger { color:var(--err); }
.btn.danger:hover { border-color:var(--err); color:var(--err); }
.btn.sm { padding:2px 10px; font-size:12px; }
.empty { color:var(--muted); text-align:center; padding:18px; }
.mono { font-family:ui-monospace,monospace; font-size:12px; }
.meta { color:var(--muted); font-size:12px; margin-bottom:12px; }
input, select { background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:6px 10px; font-size:13px; }
input:focus, select:focus { outline:2px solid var(--pri); outline-offset:1px; }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; display:none; z-index:99; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:50; }
.modal-bg.show { display:flex; }
.modal { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; width:680px; max-width:94vw; max-height:88vh; overflow-y:auto; }
.modal h3 { margin-bottom:14px; font-size:16px; }
.acc-select { display:flex; flex-wrap:wrap; gap:8px; max-height:150px; overflow-y:auto; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); }
.acc-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:12px; user-select:none; }
.acc-chip input { margin:0; accent-color:var(--pri); cursor:pointer; }
.acc-chip:hover { border-color:var(--pri); }
.acc-chip.checked { background:var(--pri); color:#fff; border-color:var(--pri); }
.acc-chip.checked input { accent-color:#fff; }
.form-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.form-grid .full { grid-column:1/-1; }
.form-row { margin-bottom:12px; }
.form-row .hint { font-size:11px; color:var(--muted); margin-top:3px; }

/* ---- 泳道图 ---- */
.board-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.board-tab { padding:6px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:13px; }
.board-tab.active { background:var(--pri); color:#fff; border-color:var(--pri); }
.board-tab .model-tag { font-size:11px; opacity:.75; margin-left:6px; }
.swimlane-wrap { display:flex; gap:0; overflow-x:auto; align-items:stretch; }
.swimlane { flex:0 0 230px; min-width:230px; background:var(--lane-bg); border:1px solid var(--border); border-radius:10px; margin-right:10px; padding:10px; display:flex; flex-direction:column; }
.swimlane.all-down { border-color:var(--err); box-shadow:0 0 0 1px var(--err); }
.swimlane-head { text-align:center; padding:6px 4px 10px; border-bottom:1px dashed var(--border); margin-bottom:8px; }
.swimlane-head .lane-name { font-weight:600; font-size:13px; }
.swimlane-head .lane-prio { color:var(--muted); font-size:11px; margin-top:2px; }
.swimlane-head .lane-status { margin-top:5px; }
.swimlane-foot { margin-top:auto; padding-top:8px; font-size:11px; color:var(--muted); text-align:center; }
.acc-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:12px; position:relative; }
.acc-card.healthy { border-left:3px solid var(--ok); }
.acc-card.disabled { border-left:3px solid var(--err); background:rgba(220,38,38,.06); }
.acc-card.suppressed { border-left:3px solid var(--muted); opacity:.65; background:var(--bg); }
.acc-card.probing { border-left:3px solid var(--warn); }
.swimlane.all-suppressed { border-style:dashed; border-color:var(--muted); opacity:.8; }
.acc-card .row1 { display:flex; align-items:center; gap:6px; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
.dot.healthy { background:var(--ok); }
.dot.disabled { background:var(--err); }
.dot.suppressed { background:var(--muted); }
.dot.probing { background:var(--warn); }
.acc-card .name { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.acc-card .row2 { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; align-items:center; }
.acc-card .row3 { margin-top:6px; color:var(--muted); font-size:11px; }
.acc-card .probe-btn { margin-left:auto; }
.badge.model-disabled { background:rgba(220,38,38,.15); color:var(--err); }
.down-arrow { text-align:center; color:var(--err); font-size:18px; flex:0 0 22px; display:flex; align-items:center; justify-content:center; }
.board-meta { color:var(--muted); font-size:12px; margin-bottom:10px; }
.hist-row-laneboard { background:rgba(37,99,235,.05); }
.hist-item { border:1px solid var(--border); border-radius:8px; padding:8px 12px; }
.hist-head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; }
.hist-msg { margin-top:4px; color:var(--muted); font-size:12px; word-break:break-all; }
</style>
</head>
<body>
<h1>🏊 {{.SiteName}} <button class="btn refresh" onclick="loadAll()">刷新</button></h1>
<div class="meta">每个泳道图 = 一个模型 · 泳道从左到右优先级从高到低 · 账号 60s 内该模型失败 ≥N 次 → 关闭该模型调度，30s 探测恢复 · 泳道全挂 → 立即探测下一泳道</div>

<div class="board-tabs">
  <span style="color:var(--muted);font-size:13px">泳道图：</span>
  <div id="boardTabBar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"></div>
  <button class="btn primary" onclick="openBoardModal()">+ 新建泳道图</button>
</div>
<div id="boardView"><div class="empty">加载中…</div></div>

<div class="card">
  <h2>📜 记录 <span style="font-size:12px;color:var(--muted)">（泳道图开关事件）</span></h2>
  <div id="histList" style="display:flex;flex-direction:column;gap:6px"></div>
  <div id="histPager" style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap">
    <button class="btn sm" id="histPrev" onclick="histPage(-1)">← 上一页</button>
    <span id="histPageInfo" style="font-size:13px;color:var(--muted)"></span>
    <button class="btn sm" id="histNext" onclick="histPage(1)">下一页 →</button>
    <span style="font-size:12px;color:var(--muted)">每页 <select id="histPageSize" onchange="histReload()" style="padding:2px 4px">
      <option value="15" selected>15</option>
      <option value="30">30</option>
      <option value="50">50</option>
    </select> 条</span>
  </div>
</div>

<!-- 泳道图编辑弹窗 -->
<div class="modal-bg" id="boardModal">
  <div class="modal">
    <h3 id="boardModalTitle">新建泳道图</h3>
    <input type="hidden" id="bf_id">
    <div class="form-grid">
      <div class="form-row">
        <label>泳道图名称 *</label>
        <input id="bf_name" placeholder="如：主模型 gpt-5.5">
      </div>
      <div class="form-row">
        <label>模型 *（泳道图=模型）</label>
        <input id="bf_model" placeholder="如 gpt-5.5" onchange="loadCandidates()">
      </div>
      <div class="form-row">
        <label>启用</label>
        <select id="bf_enabled"><option value="true">启用</option><option value="false">停用</option></select>
      </div>
      <div class="form-row">
        <label>失败阈值（窗口内次数）</label>
        <input id="bf_threshold" type="number" value="3" min="1">
      </div>
      <div class="form-row">
        <label>统计窗口（秒）</label>
        <input id="bf_window" type="number" value="60" min="10">
      </div>
      <div class="form-row">
        <label>探测间隔（秒）</label>
        <input id="bf_probe" type="number" value="30" min="10">
      </div>
    </div>
    <div class="form-row">
      <label>泳道（从左到右 = 优先级从高到低；每个泳道勾选该模型的账号）</label>
      <div id="laneEditor"></div>
      <button class="btn sm" onclick="addLane()" style="margin-top:6px">+ 添加泳道</button>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
      <button class="btn" onclick="closeBoardModal()">取消</button>
      <button class="btn primary" onclick="saveBoard()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
if (token) {
  const cleanUrl = new URL(location.href);
  cleanUrl.searchParams.delete('token');
  history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
}
function apiUrl(p) {
  const base = location.pathname.replace(/\/+$/, '') + '/api';
  return base + p;
}
async function j(p, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(apiUrl(p), { ...opts, headers });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) { toast('未授权：token 无效或已过期'); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error(body.error || body.message || r.statusText || ('HTTP ' + r.status));
  return body;
}
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
function badge(cls, txt) { return `<span class="badge ${cls}">${txt}</span>`; }
function esc(s) { return String(s ?? '').replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function schedBadge(v) { return v ? badge('ok','开') : badge('err','关'); }
function fmtTime(s) {
  if (!s) return '-';
  const d = new Date(s);
  return isNaN(d.getTime()) ? esc(s) : d.toLocaleString();
}

// 最近活动 = 探测时间 / 成功调用时间（usage_logs）中较新者，只显示一个
function latestActivity(a) {
  const p = a.last_probe_at ? new Date(a.last_probe_at).getTime() : 0;
  const s = a.last_success_at ? new Date(a.last_success_at).getTime() : 0;
  if (p > 0 && p >= s) {
    const tag = a.last_probe_ok === false
      ? ' · ❌ 探测失败' + (a.last_probe_msg ? ': ' + esc(a.last_probe_msg) : '')
      : (a.last_probe_ok === true ? ' · ✅ 探测' : ' · 探测');
    return fmtTime(a.last_probe_at) + tag;
  }
  if (s > 0) return fmtTime(a.last_success_at) + ' · 成功调用';
  return '-';
}

// ============ 泳道图 ============
let boards = [];
let curBoardId = 0;

async function loadAll() {
  await Promise.all([loadBoards(), loadHistory()]);
}

let refreshInFlight = false;
async function refreshAll() {
  if (refreshInFlight) return;
  refreshInFlight = true;
  try {
    await loadAll();
  } finally {
    refreshInFlight = false;
  }
}

async function loadBoards() {
  const d = await j('/boards');
  boards = d.boards || [];
  renderBoardTabs();
  if (!curBoardId || !boards.find(b => b.id === curBoardId)) curBoardId = boards.length ? boards[0].id : 0;
  renderBoard();
}

function renderBoardTabs() {
  const bar = document.getElementById('boardTabBar');
  bar.innerHTML = boards.map(b =>
    `<div class="board-tab ${b.id===curBoardId?'active':''}" onclick="curBoardId=${b.id};renderBoardTabs();renderBoard()">
       ${esc(b.name)}<span class="model-tag">${esc(b.model)}</span>
     </div>`).join('') || '<span style="color:var(--muted)">暂无泳道图</span>';
}

function renderBoard() {
  const box = document.getElementById('boardView');
  const b = boards.find(x => x.id === curBoardId);
  if (!b) { box.innerHTML = '<div class="empty">还没有泳道图 —— 点击「新建泳道图」，选一个模型开始</div>'; return; }
  const meta = `模型 <b class="mono">${esc(b.model)}</b> · 失败阈值 ${b.fail_threshold} 次/${b.window_seconds}s · 探测间隔 ${b.probe_interval}s · ${b.enabled ? badge('ok','运行中') : badge('muted','已停用')}
    <button class="btn sm" style="margin-left:8px" onclick="openBoardModal(${b.id})">编辑</button>
    <button class="btn sm danger" onclick="deleteBoard(${b.id})">删除</button>`;
  const lanesHtml = b.lanes.map((l, i) => {
    const next = b.lanes[i+1];
    const allSuppressed = l.account_ids.length > 0 && l.accounts.length > 0 && l.accounts.every(a => a.state === 'suppressed');
    const laneCls = l.all_down ? 'all-down' : (allSuppressed ? 'all-suppressed' : '');
    const laneStatus = l.all_down ? badge('err','全挂 ↓下探')
      : allSuppressed ? badge('muted','压制中')
      : (l.down_count ? badge('warn', l.down_count+' 禁用') : badge('ok','正常'));
    const laneFoot = l.all_down ? '全部不可用 → 释放下一泳道'
      : allSuppressed ? '被高泳道压制，等待释放' : '&nbsp;';
    return `<div class="swimlane ${laneCls}">
      <div class="swimlane-head">
        <div class="lane-name">${esc(l.name || ('泳道'+(i+1)))}</div>
        <div class="lane-prio">位置 ${i+1}${l.account_ids.length ? ' · '+l.account_ids.length+' 账号' : ''}</div>
        <div class="lane-status">${laneStatus}</div>
      </div>
      ${l.accounts.map(a => accCard(a, b)).join('') || '<div class="empty" style="padding:10px">空泳道</div>'}
      <div class="swimlane-foot">${laneFoot}</div>
    </div>${next ? '<div class="down-arrow">▶</div>' : ''}`;
  }).join('');
  box.innerHTML = `<div class="board-meta">${meta}</div><div class="swimlane-wrap">${lanesHtml || '<div class="empty">该泳道图没有泳道</div>'}</div>`;
}

function accCard(a, b) {
  const stateCls = a.state === 'disabled' ? 'disabled' : (a.state === 'suppressed' ? 'suppressed' : (a.last_probe_ok === false ? 'probing' : 'healthy'));
  const dot = `<span class="dot ${stateCls}"></span>`;
  const stateTxt = a.state === 'disabled' ? badge('err','禁用') : a.state === 'suppressed' ? badge('muted','压制') : (a.last_probe_ok === false ? badge('warn','探测失败') : badge('ok','正常'));
  const mrl = a.model_disabled ? `<span class="badge model-disabled" title="${esc(a.model_limit_info||'')}">模型限流/禁用</span>` : '';
  const mrlNote = a.model_limit_info && a.model_limit_info.startsWith('lane_board:') ? '（泳道图关）' : (a.model_limit_info ? '（上游）' : '');
  return `<div class="acc-card ${stateCls}">
    <div class="row1">${dot}<span class="name" title="${esc(a.name)}">${esc(a.name)}</span>
      <span class="mono" style="color:var(--muted)">#${a.id}</span></div>
    <div class="row2">
      ${stateTxt} ${schedBadge(a.schedulable)} ${mrl}${mrlNote}
      ${a.fail_count > 0 ? badge('warn', a.fail_count+' 连续探测失败') : ''}
      <button class="btn sm probe-btn" onclick="probeAccount(${b.id},${a.id})">探测</button>
    </div>
    <div class="row3">最近活动：${latestActivity(a)}</div>
  </div>`;
}

async function probeAccount(boardId, accountId) {
  try {
    const d = await j(`/boards/${boardId}/probe/${accountId}`, { method:'POST' });
    if (d.healthy) toast('✅ 探测成功，已恢复调度');
    else toast('⚠️ ' + (d.message || '探测失败'));
    await loadBoards();
  } catch (e) {
    toast('探测失败: ' + e.message);
  }
}

let histPageNum = 1;
let histTotal = 0;
const HIST_PAGE_SIZE = 15;

function histActionBadge(a) {
  switch (a) {
    case 'suppress': return badge('warn', '压制');
    case 'release':  return badge('pri', '释放');
    case 'disable':  return badge('err', '禁用');
    case 'enable':   return badge('ok', '恢复');
    default:         return badge('muted', esc(a || '-'));
  }
}

async function loadHistory() {
  const pageSize = parseInt(document.getElementById('histPageSize').value) || HIST_PAGE_SIZE;
  const d = await j(`/history?page=${histPageNum}&page_size=${pageSize}`);
  histTotal = d.total || 0;
  const b = document.getElementById('histList');
  if (!d.history || d.history.length === 0) {
    b.innerHTML = '<div class="empty">暂无记录</div>';
  } else {
    b.innerHTML = d.history.map(h => `
      <div class="hist-item ${h.triggered_by==='laneboard'?'hist-row-laneboard':''}">
        <div class="hist-head">
          <span class="mono">${fmtTime(h.created_at)}</span>
          <span style="color:var(--muted)">${esc(h.rule_name)}</span>
          <span>${esc(h.account_name)} <span class="mono" style="color:var(--muted)">#${h.account_id}</span></span>
          ${histActionBadge(h.action)}
          ${h.triggered_by === 'laneboard' ? badge('pri','泳道图') : ''}
        </div>
        <div class="hist-msg">${esc(h.message)}</div>
      </div>`).join('');
  }
  // 分页控件
  const maxPage = Math.max(1, Math.ceil(histTotal / pageSize));
  document.getElementById('histPageInfo').textContent = `第 ${histPageNum} / ${maxPage} 页 · 共 ${histTotal} 条`;
  document.getElementById('histPrev').disabled = histPageNum <= 1;
  document.getElementById('histNext').disabled = histPageNum >= maxPage;
}

function histPage(delta) {
  const pageSize = parseInt(document.getElementById('histPageSize').value) || HIST_PAGE_SIZE;
  const maxPage = Math.max(1, Math.ceil(histTotal / pageSize));
  histPageNum = Math.min(maxPage, Math.max(1, histPageNum + delta));
  loadHistory();
}

function histReload() {
  histPageNum = 1;
  loadHistory();
}

// ============ 泳道图编辑 ============
let candidates = [];
let lanes = [];

function loadCandidates() {
  const model = document.getElementById('bf_model').value.trim();
  if (!model) { candidates = []; renderLaneEditor(); return; }
  j('/board-candidates?model=' + encodeURIComponent(model)).then(d => {
    candidates = d.accounts || [];
    renderLaneEditor(); // 候选到达后重渲染泳道勾选（修复异步竞态）
  }).catch(() => {
    candidates = [];
    renderLaneEditor();
  });
}

function renderLaneEditor() {
  const box = document.getElementById('laneEditor');
  if (!lanes.length) lanes = [{ name:'泳道1（最高优先级）', account_ids:new Set() }];
  box.innerHTML = lanes.map((l, i) => `
    <div style="border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--bg)">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <input style="flex:1" value="${esc(l.name)}" placeholder="泳道名（如 泳道${i+1}）" onchange="lanes[${i}].name=this.value">
        <span class="mono" style="color:var(--muted)">位置 ${i+1}（优先级 ${i===0?'最高':i+1}）</span>
        ${i>0?'<button class="btn sm" onclick="moveLane('+i+',-1)">↑</button>':''}
        ${i<lanes.length-1?'<button class="btn sm" onclick="moveLane('+i+',1)">↓</button>':''}
        <button class="btn sm danger" onclick="lanes.splice(${i},1);renderLaneEditor()">✕</button>
      </div>
      <div class="acc-select">
        ${candidates.map(a => {
          const sel = l.account_ids.has(a.id);
          return `<label class="acc-chip ${sel?'checked':''}" onclick="toggleLaneAcc(${i},${a.id},this)">
            <input type="checkbox" ${sel?'checked':''} onchange="event.stopPropagation()">${esc(a.name)} <span class="mono">#${a.id}</span>
          </label>`;
        }).join('') || '<span style="color:var(--muted)">模型候选账号会显示在这里</span>'}
      </div>
    </div>`).join('');
}

function toggleLaneAcc(laneIdx, accId, el) {
  const s = lanes[laneIdx].account_ids;
  if (s.has(accId)) { s.delete(accId); el.classList.remove('checked'); el.querySelector('input').checked = false; }
  else { s.add(accId); el.classList.add('checked'); el.querySelector('input').checked = true; }
  lanes.forEach((l, i) => { if (i !== laneIdx && l.account_ids.has(accId)) { l.account_ids.delete(accId); } });
}

function addLane() { lanes.push({ name:'泳道'+(lanes.length+1), account_ids:new Set() }); renderLaneEditor(); }
function moveLane(i, dir) {
  const t = lanes[i]; lanes[i] = lanes[i+dir]; lanes[i+dir] = t; renderLaneEditor();
}

function openBoardModal(id) {
  lanes = []; candidates = [];
  document.getElementById('bf_id').value = id || '';
  document.getElementById('boardModalTitle').textContent = id ? '编辑泳道图' : '新建泳道图';
  document.getElementById('bf_name').value = '';
  document.getElementById('bf_model').value = '';
  document.getElementById('bf_enabled').value = 'true';
  document.getElementById('bf_threshold').value = '3';
  document.getElementById('bf_window').value = '60';
  document.getElementById('bf_probe').value = '30';
  document.getElementById('laneEditor').innerHTML = '';
  document.getElementById('boardModal').classList.add('show');
  if (id) {
    const b = boards.find(x => x.id === id);
    if (b) {
      document.getElementById('bf_name').value = b.name;
      document.getElementById('bf_model').value = b.model;
      document.getElementById('bf_enabled').value = String(b.enabled);
      document.getElementById('bf_threshold').value = b.fail_threshold;
      document.getElementById('bf_window').value = b.window_seconds;
      document.getElementById('bf_probe').value = b.probe_interval;
      // 先铺好已有泳道，再异步加载候选；候选到达后 renderLaneEditor 会重渲染
      lanes = b.lanes.map(l => ({ name: l.name, account_ids: new Set(l.account_ids) }));
      renderLaneEditor();
      loadCandidates();
    }
  } else {
    renderLaneEditor();
  }
}

function closeBoardModal() { document.getElementById('boardModal').classList.remove('show'); }

async function saveBoard() {
  const id = document.getElementById('bf_id').value;
  const model = document.getElementById('bf_model').value.trim();
  const body = {
    name: document.getElementById('bf_name').value.trim(),
    model: model,
    enabled: document.getElementById('bf_enabled').value === 'true',
    fail_threshold: parseInt(document.getElementById('bf_threshold').value) || 3,
    window_seconds: parseInt(document.getElementById('bf_window').value) || 60,
    probe_interval: parseInt(document.getElementById('bf_probe').value) || 30,
    lanes: lanes.map((l, i) => ({ position: i, name: l.name, account_ids: [...l.account_ids] })),
  };
  if (!body.name || !body.model) { toast('请填写名称和模型'); return; }
  const flat = body.lanes.flatMap(l => l.account_ids);
  if (!flat.length) { toast('请至少勾选一个账号'); return; }
  try {
    if (id) await j('/boards/'+id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    else await j('/boards', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    toast('✅ 泳道图已保存');
    closeBoardModal();
    loadBoards();
  } catch(e) { toast('保存失败: '+e.message); }
}

async function deleteBoard(id) {
  if (!confirm('确认删除该泳道图？删除会恢复所有被它禁用的模型调度。')) return;
  try {
    await j('/boards/'+id, { method:'DELETE' });
    toast('已删除');
    await loadBoards();
  } catch (e) {
    toast('删除失败: ' + e.message);
  }
}

refreshAll().catch(e => toast('加载失败: ' + e.message));
setInterval(() => refreshAll().catch(() => {}), 5000);
</script>
